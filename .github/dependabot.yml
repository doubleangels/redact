version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-android-build"
    schedule:
      interval: daily
    target-branch: dev
    commit-message:
      prefix: "[Github Actions]"

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: "[Gradle]"
    open-pull-requests-limit: 10
    groups:
      media3:
        patterns:
          - "androidx.media3:*"
      sentry:
        patterns:
          - "io.sentry*"

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: "[Bundler]"
