version: 2
updates:
  # One pull request a week for every action, instead of one a day for each.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-android-build"
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: "[Github Actions]"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: "[Gradle]"
    open-pull-requests-limit: 10
    groups:
      media3:
        patterns:
          - "androidx.media3:*"
      lifecycle:
        patterns:
          - "androidx.lifecycle:*"
      sentry:
        patterns:
          - "io.sentry*"
      # Everything else shares one pull request; a major version still gets its own.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: "[Bundler]"
    groups:
      gems:
        patterns:
          - "*"
