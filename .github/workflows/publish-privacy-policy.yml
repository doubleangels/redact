name: Publish Privacy Policy

# The privacy policy lives here, under legal/, so it's versioned with the app
# it describes. This workflow publishes it to doubleangels/privacypolicy,
# which keeps serving it at the same URL
# (https://doubleangels.github.io/privacypolicy/redact.html) that's hardcoded
# into every build of the app (strings.xml, all locales) and into the Play
# Console's Privacy Policy URL field. Never rename or move the published
# path without updating both of those first.

on:
  push:
    branches: ["main"]
    paths:
      - "legal/redact.html"
      - "legal/assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redact (source)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            legal
          sparse-checkout-cone-mode: true

      - name: Checkout privacypolicy (destination)
        uses: actions/checkout@v5
        with:
          repository: doubleangels/privacypolicy
          token: ${{ secrets.PRIVACYPOLICY_DEPLOY_TOKEN }}
          path: privacypolicy

      - name: Sync published files
        run: |
          cp legal/redact.html privacypolicy/redact.html
          mkdir -p privacypolicy/assets
          cp legal/assets/redact-icon.png privacypolicy/assets/redact-icon.png

      - name: Commit and push if changed
        working-directory: privacypolicy
        run: |
          git config user.name "redact-privacy-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add redact.html assets/redact-icon.png
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Sync redact.html from doubleangels/redact@${GITHUB_SHA}"
          git push origin main
