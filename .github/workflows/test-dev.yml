name: Development Build Testing

on:
  push:
    branches:
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
  # Called by deploy.yml so a release runs the same tests and lint.
  workflow_call:
    inputs:
      build:
        description: Also build the release bundle ("false" to skip, deploy builds its own).
        type: string
        default: "true"

permissions:
  contents: read

concurrency:
  group: test-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-report-${{ github.job }}
          path: |
            **/build/reports/tests
            **/build/test-results
          retention-days: 7

  lint:
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Run Android Lint
        run: ./gradlew lintRelease

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-report-${{ github.job }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.txt
          retention-days: 7

  build:
    if: |
      inputs.build != 'false' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Build release bundle
        run: ./gradlew bundleRelease
