name: Development Build Testing

on:
  push:
    branches:
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
  # Called by deploy.yml so a release runs the same tests and lint.
  workflow_call:
    inputs:
      build:
        description: Also build the release bundle ("false" to skip, deploy builds its own).
        type: string
        default: "true"

permissions:
  contents: read

concurrency:
  group: test-dev-${{ github.ref }}
  cancel-in-progress: true

# Each job runs one Gradle build on a fresh runner, where a daemon only costs memory and start-up.
# gradle.properties turns the daemon on for local builds, which reuse it between commands.
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # A push or pull request that only touches files the build, tests and lint never read (store
  # listing, website, docs, slash commands) skips the three jobs below. The run still finishes
  # green on that commit, which /release and required checks look for.
  # Fails closed: the jobs are skipped only when this job proves every changed file is on the
  # list and says skip=true. An API error, a forced push, 300 or more files, a release, an empty
  # output or this job failing all run everything.
  changes:
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.diff.outputs.skip }}
    steps:
      - name: Look for changes the checks cover
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCED: ${{ github.event.forced }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NOT_BUILT: '^(fastlane/|whatsnew/|site/|legal/|icons/|scripts/|\.claude/|\.idea/|Gemfile(\.lock)?$|LICENSE$|sentry\.dsn\.local\.example$|[^/]+\.md$)'
        run: |
          set -u
          skip=false
          if { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; } && [ "$FORCED" != true ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
                --jq '.files[] | .filename, (.previous_filename // empty)') \
              && [ -n "$files" ] \
              && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ] \
              && ! printf '%s\n' "$files" | grep -Evq "$NOT_BUILT"; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Skip the checks: $skip"

  unit-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      # Robolectric downloads one android-all jar per Android version the tests use (31, 33 and 34)
      # into ~/.m2 on every fresh runner; the Gradle cache does not cover that folder.
      - name: Cache Robolectric Android jars
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      # Debug only: the release variant reruns the same tests, and coverage is measured on debug.
      - name: Run unit tests and check coverage
        run: ./gradlew testDebugUnitTest jacocoTestCoverageVerification

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-report-${{ github.job }}
          path: |
            **/build/reports/tests
            **/build/test-results
          retention-days: 7

  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Run Android Lint
        run: ./gradlew lintRelease

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-report-${{ github.job }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.txt
          retention-days: 7

  build:
    needs: changes
    if: ${{ !cancelled() && inputs.build != 'false' && needs.changes.result != 'skipped' && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Build release bundle
        run: ./gradlew bundleRelease exportReleaseManifest

      # A library can add a permission or an exported component without touching our manifest.
      - name: Check the release manifest against app/release-manifest.txt
        run: python3 .github/scripts/check_release_manifest.py
