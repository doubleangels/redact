name: Publish Website

# Publishes site/ (the landing page and guides) to GitHub Pages at
# https://doubleangels.github.io/redact/ on every change pushed to dev.
# Needs Settings > Pages > Source set to "GitHub Actions" once.

on:
  push:
    branches:
      - dev
    paths:
      - site/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout redact
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            site
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
