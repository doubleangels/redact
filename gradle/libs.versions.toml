[versions]
activity = "1.13.0"
agp = "9.5.1"
constraintlayout = "2.2.2"
customview = "1.2.0"
exifinterface = "1.4.2"
fragment = "1.9.1"
glide = "5.0.9"
appcompat = "1.8.0"
material = "1.14.0"
media3 = "1.11.1"
lifecycle = "2.11.0"
recyclerview = "1.4.0"
sentry = "8.64.0"
sentryGradlePlugin = "6.26.0"
leakcanary = "2.14"
junit = "4.13.2"
robolectric = "4.17"
archCoreTesting = "2.2.0"
baselineprofile = "1.5.0"
