plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.sentry.android.gradle)
    alias(libs.plugins.baselineprofile)
}

android {
    namespace 'com.doubleangels.redact'
    compileSdk {
        version = release(37) {
            minorApiLevel = 0
        }
    }

    defaultConfig {
        applicationId "com.doubleangels.redact"
        minSdk 31
        targetSdk 37
        versionCode 27
        versionName "1.6.0"

        def sentryRelease = "${applicationId}@${versionName}+${versionCode}"
        buildConfigField "String", "SENTRY_RELEASE", "\"${sentryRelease}\""
    }

    buildTypes {
        debug {
            enableUnitTestCoverage = true
            buildConfigField "String", "SENTRY_DSN", "\"${resolveSentryDsnForDebug()}\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "SENTRY_DSN", "\"${resolveSentryDsnForRelease()}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Each fork builds its own Robolectric sandboxes, which need more than the 512 MB default.
                maxHeapSize = "2g"
                maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
                // Robolectric-loaded classes need includeNoLocationClasses for JaCoCo to see them; the
                // include keeps it from instrumenting the whole Android framework as well.
                jacoco {
                    includeNoLocationClasses = true
                    includes = ['com.doubleangels.redact.*']
                    excludes = ['jdk.internal.*']
                }
                testLogging {
                    events "failed"
                    exceptionFormat "full"
                }
            }
        }
    }

}

def resolveSentryDsnForRelease() {
    def ciDsn = System.getenv("SENTRY_DSN")
    if (ciDsn != null && !ciDsn.trim().isEmpty()) {
        return ciDsn.trim()
    }
    return ""
}

def resolveSentryDsnForDebug() {
    def ciDsn = System.getenv("SENTRY_DSN")
    if (ciDsn != null && !ciDsn.trim().isEmpty()) {
        return ciDsn.trim()
    }
    def fromFile = readSentryDsnLocalFile()
    if (!fromFile.isEmpty()) {
        return fromFile
    }
    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
        def fromLocal = localProps.getProperty("sentry.dsn")
        if (fromLocal != null && !fromLocal.trim().isEmpty()) {
            return fromLocal.trim()
        }
    }
    return ""
}

def readSentryDsnLocalFile() {
    def dsnFile = rootProject.file("sentry.dsn.local")
    if (!dsnFile.exists()) {
        return ""
    }
    for (line in dsnFile.readLines()) {
        def trimmed = line.trim()
        if (!trimmed.isEmpty() && !trimmed.startsWith("#")) {
            return trimmed
        }
    }
    return ""
}

dependencies {
    implementation(libs.sentry.android)
    implementation(libs.sentry.android.fragment)
    implementation libs.activity
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.exifinterface
    implementation libs.fragment
    implementation libs.glide
    annotationProcessor libs.glide.compiler
    implementation libs.material
    implementation libs.media3.common
    implementation libs.media3.effect
    implementation libs.media3.transformer
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.profileinstaller
    implementation libs.core.splashscreen
    baselineProfile project(':baselineprofile')

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.arch.core.testing

    debugImplementation libs.leakcanary.android
}

sentry {
    org = "doubleangels"
    projectName = "redact"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
    includeProguardMapping = true
    autoUploadProguardMapping = System.getenv("SENTRY_AUTH_TOKEN") != null
    telemetry = false
    // No DB/OkHttp/Compose in the app and per-file I/O spans are too fine-grained; Log->breadcrumb
    // rewriting is unused (auto breadcrumbs are off).
    tracingInstrumentation {
        enabled = false
        logcat {
            enabled = false
        }
    }
    autoInstallation {
        enabled = false
    }
}

// Unit test line coverage of the app's own code. Generated classes (view binding, Glide's
// generated API, BuildConfig, R, Sentry's build-time options) are left out.
def coverageExcludes = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.class', '**/Manifest*.class',
        '**/databinding/**', '**/DataBinderMapperImpl*.class',
        '**/media/GlideApp.class', '**/media/GlideOptions.class',
        '**/media/GlideRequest.class', '**/media/GlideRequests.class',
        '**/GeneratedAppGlideModule*.class', '**/GeneratedRequestManagerFactory.class',
        'io/sentry/**',
]
def coverageClasses = fileTree(
        dir: layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes'),
        excludes: coverageExcludes)
def coverageData = layout.buildDirectory.file(
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec')

tasks.register('jacocoTestReport', JacocoReport) {
    group = 'verification'
    description = 'Writes the unit test coverage report, without generated code, to build/reports/jacoco.'
    dependsOn 'testDebugUnitTest'
    classDirectories.setFrom(coverageClasses)
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(coverageData)
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fails when unit tests cover less than 87% of the app\'s lines.'
    dependsOn 'testDebugUnitTest'
    classDirectories.setFrom(coverageClasses)
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(coverageData)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.87
            }
        }
    }
}
